name: Release

# Triggered by pushing a version tag, e.g.:
#   git tag 0.1.0
#   git push origin 0.1.0
#
# Builds the tool for Linux, Windows and macOS, packages each binary
# together with the README, and publishes everything (plus a SHA256SUMS.txt
# file) as a GitHub Release with auto-generated release notes.
# Tags containing a "-" (e.g. 0.2.0-rc1) are published as pre-releases.
# Tags are plain versions WITHOUT a leading "v".

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify tag matches Cargo.toml version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Guards against releasing tag "1.2.0" while Cargo.toml still says 1.1.0.
      - name: Compare tag and package version
        run: |
          if [ ! -f Cargo.toml ]; then
            # Linux is case-sensitive, Windows is not: a file committed as
            # "cargo.toml" works locally on Windows but is not found here.
            WRONG_CASE=$(find . -maxdepth 1 -iname 'cargo.toml' | head -n 1)
            if [ -n "$WRONG_CASE" ]; then
              echo "::error::Found '$WRONG_CASE' but the file must be named exactly 'Cargo.toml' (capital C). Rename it with a two-step git mv: git mv cargo.toml cargo.tmp && git mv cargo.tmp Cargo.toml"
            else
              echo "::error::No Cargo.toml in the repository root. Repository root contains:"
            fi
            ls -la
            exit 1
          fi
          CARGO_VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)".*/\1/')
          TAG_VERSION="$GITHUB_REF_NAME"
          echo "Cargo.toml version: $CARGO_VERSION"
          echo "Tag version:        $TAG_VERSION"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $CARGO_VERSION in Cargo.toml. Update Cargo.toml (and commit) or use the matching tag."
            exit 1
          fi

      # `cargo build --locked` (used below) fails with a cryptic message if
      # Cargo.lock is missing or stale. Check it early and explain the fix.
      - name: Verify Cargo.lock is committed and up to date
        run: |
          if [ ! -f Cargo.lock ]; then
            echo "::error::Cargo.lock is not in the repository. Run 'cargo build' locally, then commit it: git add Cargo.lock"
            exit 1
          fi
          if ! cargo metadata --locked --format-version 1 > /dev/null 2> lock_error.txt; then
            cat lock_error.txt
            echo "::error::Cargo.lock does not match Cargo.toml (typical after bumping the version). Run 'cargo build' locally, then commit the updated Cargo.lock."
            exit 1
          fi

  build:
    name: Build (${{ matrix.name }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            ext: ""
    env:
      BIN: fido2-cred-manager
      PKG: fido2-cred-manager-${{ github.ref_name }}-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build (release)
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Linux/macOS: .tar.gz (keeps the executable permission bit).
      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir "$PKG"
          cp "target/${{ matrix.target }}/release/${BIN}${{ matrix.ext }}" "$PKG/"
          # Match README/LICENSE files case-insensitively (Readme.md, license.txt,
          # ...): the Linux runner is case-sensitive, so a fixed "README.md"
          # would fail if the file is committed under a different spelling.
          find . -maxdepth 1 -type f \( -iname 'readme*' -o -iname 'license*' \) -exec cp {} "$PKG/" \;
          tar czf "$PKG.tar.gz" "$PKG"
          echo "ASSET=$PKG.tar.gz" >> "$GITHUB_ENV"

      # Windows: .zip
      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path $env:PKG | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/$env:BIN${{ matrix.ext }}" $env:PKG
          # Same case-insensitive README/LICENSE matching as on Linux/macOS.
          Get-ChildItem -File | Where-Object { $_.Name -match '^(?i)(readme|license)' } | Copy-Item -Destination $env:PKG
          Compress-Archive -Path $env:PKG -DestinationPath "$env:PKG.zip"
          "ASSET=$env:PKG.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: fido2-cred-manager-${{ matrix.name }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Only this job may write to the repository (create the release).
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download all packages
        uses: actions/download-artifact@v8
        with:
          pattern: fido2-cred-manager-*
          merge-multiple: true
          path: dist

      - name: Create checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Write release notes header
        run: |
          cat > notes.md << 'EOF'
          Prebuilt binaries for Linux (x86_64), Windows (x86_64) and macOS (Apple Silicon and Intel).
          Verify downloads against `SHA256SUMS.txt`.

          **Notes**
          - **Windows:** the tool needs administrator rights and shows a UAC prompt on start.
          - **macOS:** the binaries are not signed or notarized. If Gatekeeper blocks a downloaded binary, run `xattr -d com.apple.quarantine ./fido2-cred-manager` once.
          - **Linux:** built on the latest Ubuntu runner, so very old distributions with an older glibc may not run it; build from source there.
          EOF

      - name: Create release
        run: |
          FLAGS=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then FLAGS="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag \
            $FLAGS